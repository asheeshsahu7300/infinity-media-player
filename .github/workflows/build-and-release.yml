name: Build and Publish Android Library

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew :library:assembleRelease

      - name: Publish to Maven Local
        run: ./gradlew :library:publishToMavenLocal

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-media-player-release
          path: library/build/outputs/aar/library-release.aar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: library/build/outputs/aar/library-release.aar
          generate_release_notes: true
