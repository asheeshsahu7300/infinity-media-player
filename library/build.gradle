plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.infinity.mediaplayer'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Media3 (ExoPlayer)
    def media3_version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1"

    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // ONNX Runtime for Neural Video Codec & Latent Concealment
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"

    // Kotlin Coroutines & AndroidX Core
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.annotation:annotation:1.8.0"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.asheeshsahu7300'
                artifactId = 'infinity-media-player'
                version = '1.2.0'

                pom {
                    name = 'Infinity Media Player'
                    description = 'Resilient Android Media Player SDK with NVC Neural Video Concealment, Qualcomm ACDB audio fix, and low-latency live network streaming engine.'
                    url = 'https://github.com/asheeshsahu7300/infinity-media-player'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    developers {
                        developer {
                            id = 'asheeshsahu'
                            name = 'Asheesh Sahu'
                            email = 'asheeshsahu7300@gmail.com'
                        }
                    }
                }
            }
        }
    }
}
